# Silero VAD v4 (float ONNX) -> WQ7036AC HiFi5 + Neo NPU 编译配置草案
# 依据: neuroweave_ug_NW-2.0.0 §4.9 多输入 / §4.10 流式 / §4.6.1 自动输入量化 / §9.2 Neo NPU 卸载
# 注意: xtensa_system 需指向物奇 SDK 提供的 Xtensa 安装(WQ7036 专用 HiFi5 核配置);
#       拿到后填绝对路径, 并确认 xtensa_core 名与物奇 SDK 一致(示例值 hifi5_win)。
[custom]
accelerators = NEO

[path]
input_dir = model
output_dir = output
tmp_dir = temp
image_dir = dataset

# Neo NPU 卸载(§9.2): {xnnc_dir} 为 XNNC 包路径占位符
include = {xnnc_dir}/NeoNPU/compiler/link-neo/config/Neo2x0NPU.cfg

[network]
class = Other
name = silero_vad
type = ONNX
input_graph =
input_model = silero_vad_v4_float.onnx
model_type = float

# silero v4 接口: 音频窗 x + LSTM 状态 h/c (输出 output, hn, cn)
input_node_name = x,h,c
input_data_layout = NonImage,NonImage,NonImage
# 音频不做 mean/std 预处理; 输入为 float npy, 由 XNNC 自动量化(§4.6.1),
# KWS 类模型经验: S16 非对称输入精度更好, 先让工具在 s8/u8/s16 中自动选择
input_quantize = True
mean = 0:0:0
stddev = 1:1:1

# ---- 流式模型(§4.10) ----
streaming = True
external_state_info = state.yaml

[dataset]
# 流式: 每行 = x目录,h目录,c目录 (make_calibration.py 生成)
calibration_set = calibration_list.txt
validation_set = validation_list.txt

[quantization]
accuracy_level = 0

[system]
xtensa_system = /opt/xtensa   # <- 物奇 SDK 的 Xtensa tools 安装路径(挂载进容器后修改)
xtensa_core = hifi5           # <- 与物奇 SDK 中的核配置名保持一致

[out_cntrl]
description = "
  [prob] save
  [new_h] save
  [new_c] save
  "
