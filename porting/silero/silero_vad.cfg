# Silero VAD v4 (float ONNX) -> WQ7036AC HiFi5 + Neo NPU 编译配置(已验证跑通 flt_inference)
# 依据: neuroweave_ug_NW-2.0.0 §4.9 多输入 / §4.10 流式 / §4.6.1 自动输入量化 / §9.2 Neo NPU 卸载
# 踩坑记录(勿改回):
#   - input_node_name 只列 x; LSTM 状态 h/c 由 state.yaml 管理(零初始化), 列进去会报
#     "Couldn't find placeholder: h"
#   - [custom] accelerators 不要写 NEO(会找不存在的 libNEO.so), Neo2x0NPU.cfg include 已设好
#   - 数据集 count = 序列数(清单行数), 不是窗数; 清单首行必须是序列数
#   - 序列目录内文件名必须 0.npy,1.npy,...(不补零)
#   - HiFi 要求非对称量化: accuracy_level >= 3(0 是对称量化)
#   - xtensa_system 指向 wq_hifi5_asic 安装后的 config 目录(WQCORE 工具链, 挂载于 /opt/wqcore)
[path]
input_dir = model
output_dir = output
tmp_dir = temp
image_dir = dataset

# Neo NPU 卸载(§9.2): {xnnc_dir} 为 XNNC 包路径占位符
include = {xnnc_dir}/NeoNPU/compiler/link-neo/config/Neo2x0NPU.cfg

[network]
class = Other
name = silero_vad
type = ONNX
input_graph =
input_model = silero_vad_v4_float.onnx
model_type = float

# silero v4 接口: 音频窗 x(1,512); 状态 h,c(2,1,64) -> new_h,new_c 由 state.yaml 配对
input_node_name = x
input_data_layout = NonImage
# 音频不做 mean/std 预处理; 输入为 float npy, 由 XNNC 自动量化(§4.6.1, 实测选了 Int16 非对称)
input_quantize = True
mean = 0
stddev = 1

# ---- 流式模型(§4.10) ----
streaming = True
external_state_info = state.yaml

[dataset]
# 流式: 首行序列数, 之后每行一个 x 序列目录 (make_calibration.py 生成)
calibration_set = calibration_list.txt
calibration_count = 1
validation_set = validation_list.txt
validation_count = 1

[quantization]
accuracy_level = 3

[system]
xtensa_system = /opt/wqcore/toolchain/RI-2020.4-linux/XtensaTools/config
xtensa_core = wq_hifi5_asic

[out_cntrl]
description = "
  [prob] save
  [new_h] save
  [new_c] save
  "

[performance]
# 外部 DDR 读写延迟(周期), TFLM 示例同款; 缺此段会触发 XNNC 3.2.2 configparser 整型赋值 bug
read_delay = 100
write_delay = 100
