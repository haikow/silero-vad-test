name: VAD 引擎对比 (WebRTC/FireRed/Silero)

# 多引擎对比: 原厂 WebRTC VAD(闭源 libwq_sw_vad.a 的同源开源实现, 激进度 0-3)
# vs FireRedVAD(Engineering, MIT) vs Silero 量化模型 —— 同一组场景, Mac CI 机
# Silero 侧数值 = 先跑完整用例套件生成的 scenario_metrics.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ci/compare_vad.py, vad_firered.py, requirements.txt, ".github/workflows/vad-compare.yml", "tests/**", "test_fixtures/**", "models/firered/**"]

jobs:
  vad-compare:
    runs-on: [self-hosted, vad-lab-mac]
    steps:
      - uses: actions/checkout@v4

      - name: 准备模型
        shell: bash
        run: |
          if [ -n "$VAD_MODELS_CACHE" ] && ls "$VAD_MODELS_CACHE"/*.onnx >/dev/null 2>&1; then
            mkdir -p models && cp "$VAD_MODELS_CACHE"/*.onnx models/
            echo "已从本机缓存复制 Silero 模型: $VAD_MODELS_CACHE"
          else
            python3 download_models.py
          fi
          ls -lh models/firered/

      - name: 用例套件 + 多引擎对比
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          .venv/bin/pip install --quiet -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
          .venv/bin/python -m pytest tests/ -q --junitxml=pytest-report.xml
          .venv/bin/python -W ignore ci/compare_vad.py | tee vad-compare.txt

      - name: 写入 run 页摘要
        if: always()
        shell: bash
        run: |
          if [ -f vad-compare.txt ]; then
            { echo "## VAD 引擎对比: WebRTC(原厂同源) / FireRed / Silero 量化"; echo '```'; cat vad-compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传对比数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vad-compare
          path: |
            vad-compare.txt
            scenario_metrics.json
          retention-days: 30
