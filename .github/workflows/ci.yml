name: CI

on:
  push:
    branches: [main]
  # 注意: 故意不配 pull_request 触发 —— 仓库公开, 任何人可发 PR,
  # PR 分支自带的 workflow 会被派给 self-hosted runner (本地 Mac) 执行,
  # 这是陌生人代码进入本机的唯一入口, 保持关闭
  workflow_dispatch:

# mikepenz/action-junit-report 需要写 check run (run 页逐用例标注)
permissions:
  contents: read
  checks: write

jobs:
  algo-regression:
    name: 算法基准回归 (云端)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载量化模型
        run: python download_models.py

      - name: 跑测试用例
        run: pytest tests/ -v --junitxml=pytest-report.xml

      - name: 用例报告 (run 页可见每个用例)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          check_name: "用例结果 (云端)"
          report_paths: pytest-report.xml
          include_passed: true
          annotate_notice: true
          detailed_summary: true
          job_summary: true
          require_tests: true

      - name: 上传测试报告 (排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-cloud
          path: |
            pytest-report.xml
            test_fixtures/
          retention-days: 14

  self-hosted-smoke:
    name: 本地 CI 机冒烟 (self-hosted)
    # 防御纵深: 万一将来重新启用 pull_request 触发, PR 事件也不落本地机器
    if: github.event_name != 'pull_request'
    # 跨平台: Windows/Mac runner 均可 (需 bash; Windows runner 依赖 Git Bash)
    # 接入新机器: actions-runner/.env 里配 VAD_MODELS_CACHE 指向本机模型缓存目录(可选)
    runs-on: [self-hosted, vad-lab]
    steps:
      - uses: actions/checkout@v4

      - name: 准备模型
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then PY=python3; else PY=python; fi
          if [ -n "$VAD_MODELS_CACHE" ] && ls "$VAD_MODELS_CACHE"/*.onnx >/dev/null 2>&1; then
            mkdir -p models && cp "$VAD_MODELS_CACHE"/*.onnx models/
            echo "已从本机缓存复制模型: $VAD_MODELS_CACHE"
          else
            "$PY" download_models.py
          fi

      - name: 跑测试用例
        shell: bash
        run: |
          set -e
          # Mac CI 机: brew python3(.env 里 PATH 指向 /opt/homebrew/bin); Windows: Git Bash 的 python
          if [ "$(uname -s)" = "Darwin" ]; then PY=python3; else PY=python; fi
          "$PY" -m venv .venv
          if [ -x .venv/bin/python ]; then VP=.venv/bin/python; else VP=.venv/Scripts/python.exe; fi
          "$VP" -m pip install --quiet -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
          "$VP" -m pytest tests/ -v --junitxml=pytest-report.xml

      - name: 用例报告 (run 页可见每个用例)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          check_name: "用例结果 (Mac CI 机)"
          report_paths: pytest-report.xml
          include_passed: true
          annotate_notice: true
          detailed_summary: true
          job_summary: true
          require_tests: true

      - name: 上传测试报告 (排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-mac
          path: |
            pytest-report.xml
            test_fixtures/
          retention-days: 14
